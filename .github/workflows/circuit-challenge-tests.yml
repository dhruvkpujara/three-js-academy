name: Circuit Challenge tests

on:
  push:
    paths:
      - "circuit-challenge/**"
      - ".github/workflows/circuit-challenge-tests.yml"
  pull_request:
    paths:
      - "circuit-challenge/**"
      - ".github/workflows/circuit-challenge-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuit-challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
